name: App CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      # Runs before the build because it is a second long and catches the
      # cheap class of mistake, including a curriculum manifest left stale
      # after a catalogue edit (tests/curriculum-manifest.test.ts).
      - name: Test
        run: npm test

      - name: Build
        run: npx next build --webpack
